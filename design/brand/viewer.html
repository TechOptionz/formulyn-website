<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#222}canvas{display:block;max-width:100%}#status{color:#0f0;font:14px monospace;padding:4px}</style></head><body>
<div id="status">loading…</div><canvas id="cv"></canvas>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
let doc=null;
window.ready=false;
pdfjsLib.getDocument('../uploads/BV_New_Brand_Guide_reduced.pdf').promise.then(d=>{doc=d;window.ready=true;document.getElementById('status').textContent='loaded '+d.numPages+' pages';showPage(1);});
window.showPage=async function(n){
  document.getElementById('status').textContent='rendering '+n+'…';
  const page=await doc.getPage(n);
  const vp=page.getViewport({scale:0.9});
  const cv=document.getElementById('cv');
  cv.width=vp.width;cv.height=vp.height;
  await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  document.getElementById('status').textContent='page '+n+'/'+doc.numPages;
  window.pageDone=n;
};
</script></body></html>
